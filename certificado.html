<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex, nofollow">
  <title>Seu certificado · Faixa Preta em IA</title>
  <meta name="theme-color" content="#0a0f1f">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="certflow-page">
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
  <main id="conteudo" tabindex="-1" class="certflow wrap">
    <header class="certflow-head">
      <span class="eyebrow eyebrow-gold"><span class="dot"></span><span id="turmaLabel">Certificado</span></span>
      <h1 id="cursoTitulo">Seu certificado</h1>
      <p class="muted-text">Leva cerca de 2 minutos. No fim, você baixa o certificado em PDF ou imagem.</p>
    </header>

    <ol class="certflow-steps" id="passos" aria-label="Etapas">
      <li data-step="1">Seus dados</li>
      <li data-step="2">Avaliação</li>
      <li data-step="3">Indicações</li>
      <li data-step="4">Certificado</li>
    </ol>

    <section class="aula-card certflow-card" id="etapa" aria-live="polite"><p class="loading">Carregando…</p></section>
  </main>
  <script src="assets/js/certificado-config.js"></script>
  <script src="assets/js/certificado-aluno.js"></script>
</body>
</html>
